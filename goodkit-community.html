<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GoodKit Community Marketplace</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GoodKit">
<meta name="theme-color" content="#FF5C1A">
<meta name="description" content="Shop your cycling community's gear. GoodKit community pages connect clubs, teams, and trail organizations with their members through a dedicated gear marketplace.">
<meta name="keywords" content="cycling club gear, cycling team marketplace, mountain bike club, cycling community gear exchange">
<meta property="og:type" content="website">
<meta property="og:title" content="GoodKit Community Marketplace">
<meta property="og:description" content="Your cycling community's dedicated gear marketplace. Shop local, support your club.">
<meta property="og:image" content="https://good-kit.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:site_name" content="GoodKit">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GoodKit Community Marketplace">
<meta name="twitter:description" content="Your cycling community's dedicated gear marketplace.">
<meta name="twitter:image" content="https://good-kit.com/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebPage",
  "name": "GoodKit Community Marketplace",
  "description": "Cycling community gear marketplace — shop your club's listings, support local organizations.",
  "url": "https://good-kit.com/community/",
  "isPartOf": {
    "@type": "WebSite",
    "name": "GoodKit",
    "url": "https://good-kit.com"
  }
}
</script>
<style>
  /* ── Tokens ───────────────────────────────────────────────────────── */
  :root {
    --bg:         #F9F5F1;
    --bg-subtle:  #F0EAE4;
    --border:     #DDD6CE;
    --ink:        #1A1A1A;
    --muted:      #6B6B6B;
    --orange:     #E85D26;
    --radius:     10px;
    --shadow-md:  0 4px 16px rgba(0,0,0,0.10);
    --mono:       'Space Mono', 'Courier New', monospace;
    --accent:     #E85D26; /* overridden per-community via JS */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:        #111111;
      --bg-subtle: #1C1C1C;
      --border:    #2E2E2E;
      --ink:       #F0EAE4;
      --muted:     #888;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:        #111111;
    --bg-subtle: #1C1C1C;
    --border:    #2E2E2E;
    --ink:       #F0EAE4;
    --muted:     #888;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Global nav strip ─────────────────────────────────────────────── */
  .global-nav {
    background: var(--ink);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 44px;
    font-size: 13px;
  }
  .global-nav .wordmark {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .global-nav a {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: color 0.15s;
  }
  .global-nav a:hover { color: #fff; }

  /* ── Community hero header ────────────────────────────────────────── */
  .community-hero {
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
    padding: 32px 20px 28px;
  }
  .hero-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .community-logo {
    width: 80px;
    height: 80px;
    border-radius: 16px;
    object-fit: contain;
    background: var(--bg);
    border: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    overflow: hidden;
  }
  .community-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .hero-text { flex: 1; min-width: 0; }
  .community-name {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 5px;
  }
  .community-tagline {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .cause-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .listing-count {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    font-family: var(--mono);
  }

  /* ── Section labels ───────────────────────────────────────────────── */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .accent-rule {
    width: 28px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 14px;
  }

  /* ── Main content area ────────────────────────────────────────────── */
  .content-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ── Featured section ─────────────────────────────────────────────── */
  .featured-section {
    margin-bottom: 40px;
  }
  .featured-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  /* ── Listing card ─────────────────────────────────────────────────── */
  .card {
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .card-photo {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg-subtle);
    overflow: hidden;
    position: relative;
  }
  .card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .card-photo-ph {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--border);
    font-size: 40px;
  }
  .card-cond {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(17,17,17,0.8);
    color: #fff;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }
  .featured-ribbon {
    position: absolute;
    top: 8px; right: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
  }
  .card-body { padding: 11px 13px 13px; }
  .card-cat {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-price {
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 500;
    color: var(--accent);
  }
  .card-ship { font-size: 11px; color: var(--muted); }

  /* ── All listings section ─────────────────────────────────────────── */
  .all-section { }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .count-badge {
    font-size: 12px;
    font-family: var(--mono);
    color: var(--muted);
  }
  .sort-select {
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--ink);
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
  }
  .listings-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
  }

  /* ── Empty state ──────────────────────────────────────────────────── */
  .empty {
    text-align: center;
    padding: 56px 20px;
    color: var(--muted);
    grid-column: 1 / -1;
  }
  .empty strong { display: block; font-size: 16px; color: var(--ink); margin-bottom: 8px; }

  /* ── Modal overlay ────────────────────────────────────────────────── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 520px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 20px 20px 32px;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 16px; right: 16px;
    background: var(--bg-subtle);
    border: none; border-radius: 50%;
    width: 32px; height: 32px;
    font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .modal-photo {
    width: 100%; aspect-ratio: 1;
    background: var(--bg-subtle);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .modal-photo-ph {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 60px;
  }
  .modal-cat { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .modal-title { font-size: 20px; font-weight: 700; line-height: 1.25; margin-bottom: 10px; }
  .modal-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .modal-price { font-family: var(--mono); font-size: 24px; font-weight: 500; color: var(--accent); }
  .modal-ship-tag { font-size: 12px; color: var(--muted); }
  .cond-badge {
    display: inline-block;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .modal-desc { font-size: 13px; line-height: 1.65; color: var(--muted); }
  .split-box {
    background: var(--bg-subtle);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
  }
  .split-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
  .split-row { display: flex; justify-content: space-between; padding: 4px 0; }
  .split-row.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 8px; font-weight: 700; }
  .btn-buy {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: filter 0.15s;
  }
  .btn-buy:hover { filter: brightness(1.08); }

  /* ── Toast ────────────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 200;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* ── Skeleton loader ──────────────────────────────────────────────── */
  .skel {
    background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--border) 50%, var(--bg-subtle) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
    border-radius: var(--radius);
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ── Error state ──────────────────────────────────────────────────── */
  .error-page {
    max-width: 480px;
    margin: 80px auto;
    text-align: center;
    padding: 0 20px;
  }
  .error-page h1 { font-size: 22px; margin-bottom: 10px; }
  .error-page p { color: var(--muted); font-size: 14px; }

  /* ── Responsive ───────────────────────────────────────────────────── */
  @media (max-width: 480px) {
    .hero-inner { flex-direction: column; align-items: flex-start; gap: 14px; }
    .community-logo { width: 64px; height: 64px; }
    .community-name { font-size: 22px; }
    .featured-grid, .listings-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<!-- Global nav -->
<nav class="global-nav">
  <a href="/" class="wordmark">GoodKit</a>
  <a href="/goodkit-marketplace.html">← All Listings</a>
</nav>

<!-- Hero (populated by JS) -->
<header class="community-hero" id="heroSection" style="display:none;">
  <div class="hero-inner">
    <div class="community-logo" id="heroLogo"></div>
    <div class="hero-text">
      <div class="community-name" id="heroName"></div>
      <div class="community-tagline" id="heroTagline"></div>
      <div id="causeBadgeWrap"></div>
      <div class="listing-count" id="listingCount"></div>
    </div>
  </div>
</header>

<!-- Skeleton hero shown while loading -->
<header class="community-hero" id="heroSkel">
  <div class="hero-inner">
    <div class="community-logo skel"></div>
    <div class="hero-text">
      <div class="skel" style="height:24px;width:200px;border-radius:6px;margin-bottom:10px;"></div>
      <div class="skel" style="height:14px;width:300px;border-radius:4px;margin-bottom:8px;"></div>
      <div class="skel" style="height:12px;width:120px;border-radius:4px;"></div>
    </div>
  </div>
</header>

<!-- Main content -->
<main class="content-wrap">
  <!-- Featured listings -->
  <section class="featured-section" id="featuredSection" style="display:none;">
    <div class="section-label">Featured</div>
    <div class="accent-rule" id="accentRule"></div>
    <div class="featured-grid" id="featuredGrid"></div>
  </section>

  <!-- All listings -->
  <section class="all-section">
    <div class="toolbar">
      <div class="section-label" style="margin-bottom:0;flex:1;" id="allLabel">All Listings</div>
      <span class="count-badge" id="countBadge"></span>
      <select class="sort-select" id="sortSelect" onchange="applySort()">
        <option value="newest">Newest</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
    </div>
    <div class="listings-grid" id="listingsGrid">
      <!-- skeleton cards while loading -->
      <div class="card skel" style="height:260px;"></div>
      <div class="card skel" style="height:260px;"></div>
      <div class="card skel" style="height:260px;"></div>
      <div class="card skel" style="height:260px;"></div>
    </div>
  </section>
</main>

<!-- Listing detail modal -->
<div class="modal-overlay" id="listingModal" onclick="closeModal(event)">
  <div class="modal-sheet" id="modalSheet">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-photo" id="modalPhoto"></div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  const API = window.location.hostname === 'localhost'
    ? 'http://localhost:3000'
    : 'https://api.good-kit.com';

  // Extract slug from path  /community/:slug
  const slug = window.location.pathname.split('/').filter(Boolean).pop();

  let allListings  = [];
  let featuredIds  = [];
  let currentListing = null;

  // ── Apply community accent color ─────────────────────────────────────
  function setAccent(color) {
    if (!color) return;
    document.documentElement.style.setProperty('--accent', color);
  }

  // ── Render hero section ───────────────────────────────────────────────
  function renderHero(community) {
    // Logo
    const logoEl = document.getElementById('heroLogo');
    if (community.logo_url) {
      logoEl.innerHTML = `<img src="${community.logo_url}" alt="${community.name} logo">`;
    } else {
      // Initials fallback
      const initials = community.name
        .split(' ')
        .map(w => w[0])
        .slice(0, 2)
        .join('');
      logoEl.textContent = initials;
    }

    document.getElementById('heroName').textContent = community.name;
    document.getElementById('heroTagline').textContent = community.tagline || '';

    // Cause badge
    if (community.cause_pct > 0) {
      const label = community.cause_label || community.name;
      document.getElementById('causeBadgeWrap').innerHTML =
        `<div class="cause-badge">♻ ${community.cause_pct}% of sales → ${label}</div>`;
    }

    document.getElementById('heroSkel').style.display  = 'none';
    document.getElementById('heroSection').style.display = '';

    // Update page title
    document.title = `${community.name} — GoodKit`;
  }

  // ── Build a listing card ─────────────────────────────────────────────
  function buildCard(l, isFeatured = false) {
    const photo = l.photos?.length
      ? `<img src="${API}${l.photos[0]}" alt="${escHtml(l.title)}" loading="lazy">`
      : `<div class="card-photo-ph">🚴</div>`;
    const ribbon = isFeatured
      ? `<div class="featured-ribbon">Featured</div>`
      : '';
    return `
      <div class="card" onclick="openListing('${l.id}')">
        <div class="card-photo">
          ${photo}
          <div class="card-cond">${escHtml(l.condition)}</div>
          ${ribbon}
        </div>
        <div class="card-body">
          <div class="card-cat">${escHtml(l.category)}</div>
          <div class="card-title">${escHtml(l.title)}</div>
          <div class="card-footer">
            <div class="card-price">$${Number(l.price).toFixed(0)}</div>
            <div class="card-ship">${Number(l.shipping_estimate) > 0
              ? `+$${Number(l.shipping_estimate).toFixed(0)} ship`
              : 'free ship'}</div>
          </div>
        </div>
      </div>`;
  }

  // ── Render featured row ───────────────────────────────────────────────
  function renderFeatured(listings) {
    const featured = listings.filter(l => featuredIds.includes(l.id));
    if (!featured.length) return;
    document.getElementById('featuredSection').style.display = '';
    document.getElementById('featuredGrid').innerHTML = featured.map(l => buildCard(l, true)).join('');
  }

  // ── Render main grid ──────────────────────────────────────────────────
  function renderGrid(listings) {
    const grid = document.getElementById('listingsGrid');
    if (!listings.length) {
      grid.innerHTML = `<div class="empty">
        <div style="font-size:32px;margin-bottom:10px;">🔍</div>
        <strong>No listings yet.</strong>
        <p>Be the first to list gear for this community.</p>
        <a href="/goodkit-seller-portal.html" style="display:inline-block;margin-top:14px;color:var(--accent);font-weight:600;">List gear →</a>
      </div>`;
      return;
    }
    grid.innerHTML = listings.map(l => buildCard(l)).join('');
  }

  // ── Sort & render grid ────────────────────────────────────────────────
  function applySort() {
    const sort = document.getElementById('sortSelect').value;
    let items = [...allListings];
    if (sort === 'price-asc')  items.sort((a, b) => a.price - b.price);
    if (sort === 'price-desc') items.sort((a, b) => b.price - a.price);
    document.getElementById('countBadge').textContent =
      `${items.length} listing${items.length !== 1 ? 's' : ''}`;
    renderGrid(items);
  }

  // ── Load community data ───────────────────────────────────────────────
  async function loadCommunity() {
    if (!slug) {
      showError('No community specified.');
      return;
    }
    try {
      const res = await fetch(`${API}/api/communities/${encodeURIComponent(slug)}`);
      if (!res.ok) throw new Error('not found');
      const { community, listings } = await res.json();

      // Parse featured IDs
      try { featuredIds = JSON.parse(community.featured_listing_ids || '[]'); }
      catch { featuredIds = []; }

      // Apply accent color
      setAccent(community.accent_color);
      document.getElementById('accentRule').style.background = community.accent_color || 'var(--accent)';

      // Store listings (exclude featured from main grid count, show all in grid)
      allListings = listings;

      renderHero(community);
      renderFeatured(listings);

      document.getElementById('countBadge').textContent =
        `${listings.length} listing${listings.length !== 1 ? 's' : ''}`;
      document.getElementById('allLabel').textContent =
        `All ${community.name} Gear`;

      // Clear skeleton, render grid
      renderGrid(listings);

    } catch (err) {
      showError(`Community "${slug}" not found.`);
    }
  }

  // ── Error state ───────────────────────────────────────────────────────
  function showError(msg) {
    document.getElementById('heroSkel').style.display = 'none';
    document.querySelector('.content-wrap').innerHTML = `
      <div class="error-page">
        <div style="font-size:48px;margin-bottom:16px;">🏔</div>
        <h1>Community Not Found</h1>
        <p>${escHtml(msg)}</p>
        <a href="/goodkit-marketplace.html"
           style="display:inline-block;margin-top:20px;color:var(--accent);font-weight:600;">
          Browse all listings →
        </a>
      </div>`;
  }

  // ── Listing detail modal ──────────────────────────────────────────────
  async function openListing(id) {
    try {
      const res = await fetch(`${API}/listings/${id}`);
      const data = await res.json();
      currentListing = data.listing;
      renderModal(currentListing);
      document.getElementById('listingModal').classList.add('open');
      document.body.style.overflow = 'hidden';
    } catch (e) {
      showToast('Could not load listing', 'error');
    }
  }

  function renderModal(l) {
    const photo = document.getElementById('modalPhoto');
    photo.innerHTML = l.photos?.length
      ? `<img src="${API}${l.photos[0]}" alt="${escHtml(l.title)}" style="width:100%;height:100%;object-fit:cover;">`
      : `<div class="modal-photo-ph">🚴</div>`;

    const total = (Number(l.price) + Number(l.shipping_estimate || 0)).toFixed(2);
    document.getElementById('modalBody').innerHTML = `
      <div class="modal-cat">${escHtml(l.category)}</div>
      <div class="modal-title">${escHtml(l.title)}</div>
      <div class="modal-price-row">
        <div class="modal-price">$${Number(l.price).toFixed(0)}</div>
        <div class="modal-ship-tag">${Number(l.shipping_estimate) > 0
          ? `+$${Number(l.shipping_estimate).toFixed(0)} shipping`
          : 'free shipping'}</div>
      </div>
      <div><span class="cond-badge">${escHtml(l.condition)}</span></div>
      <p class="modal-desc" style="margin-bottom:14px;">${escHtml(l.description || 'No description provided.')}</p>
      <div class="split-box">
        <div class="split-label">What you pay</div>
        <div class="split-row"><span>Item</span><span>$${Number(l.price).toFixed(2)}</span></div>
        ${Number(l.shipping_estimate) > 0
          ? `<div class="split-row"><span>Shipping</span><span>$${Number(l.shipping_estimate).toFixed(2)}</span></div>`
          : ''}
        <div class="split-row total"><span>Total</span><span>$${total}</span></div>
      </div>
      <button class="btn-buy" onclick="buyNow()">Buy Now — $${total}</button>`;
  }

  function closeModal(e) {
    if (e.target === document.getElementById('listingModal')) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById('listingModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  async function buyNow() {
    if (!currentListing) return;
    showToast('Redirecting to checkout…');
    try {
      const res = await fetch(`${API}/checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ listing_id: currentListing.id })
      });
      const data = await res.json();
      if (data.url) window.location.href = data.url;
      else showToast('Checkout unavailable right now.', 'error');
    } catch (e) {
      showToast('Checkout error — try again.', 'error');
    }
  }

  // ── Toast ─────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── Escape helper ─────────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Keyboard close ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModalDirect();
  });

  // ── Boot ──────────────────────────────────────────────────────────────
  loadCommunity();
</script>
